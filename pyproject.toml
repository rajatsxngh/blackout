[project]
name = "blackout"
version = "0.1.0"
description = "Research sandbox: Claude agents vs a rules script vs an optimization solver in a simulated city blackout. Not emergency-response software."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Blackout contributors" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.28.0",
]

[project.scripts]
blackout = "blackout.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["viewer"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
    "C4",  # comprehensions
    "N",   # naming
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["blackout"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
