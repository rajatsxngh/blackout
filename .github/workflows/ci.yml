name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Derandomized Hypothesis profile, so property tests are reproducible (tests/conftest.py).
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the exact release (docs/DECISIONS.md D012).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Tests (with coverage floor, see pyproject.toml)
        run: uv run pytest --cov
      - name: CLI smoke test
        run: uv run blackout run --scenario hello_blackout --controller scripted --quiet
      # The frozen dev suite is valid on both OSes, and on Windows, where it was made, it also
      # matches a fresh generation byte for byte (CP-SAT may pick another equally good plan
      # elsewhere, D084).
      - name: Dev suite is valid here
        run: uv run blackout verify --suite dev
      - name: Dev suite matches a fresh generation
        if: runner.os == 'Windows'
        run: uv run blackout gen --suite dev --check

  viewer:
    # The replay viewer (viewer/, docs/PRD.md 8.13): type check, unit tests and a build. It
    # needs no exported data to build; the Pages workflow adds that.
    name: viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
