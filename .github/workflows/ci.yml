name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Derandomized Hypothesis profile, so property tests are reproducible (tests/conftest.py).
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the exact release (docs/DECISIONS.md D012).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Tests (with coverage floor, see pyproject.toml)
        run: uv run pytest --cov
      - name: CLI smoke test
        run: uv run blackout run --scenario hello_blackout --controller scripted --quiet
      # The frozen dev suite must match a fresh generation on both OSes (D055, D082).
      - name: Dev suite matches a fresh generation
        run: uv run blackout gen --suite dev --check
