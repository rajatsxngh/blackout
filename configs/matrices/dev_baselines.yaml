# Baselines on the frozen dev suite (docs/PRD.md section 12, M8): do-nothing (C0), Rules (C1),
# Solver (C2) and Reference (C3, ground truth), on all 56 dev scenarios (7 templates x L0-L3
# x 2 seeds). Never on test before pre-registration (M12): the batch runner refuses it.
# Run with: uv run blackout batch --matrix configs/matrices/dev_baselines.yaml [--resume]
# Logs go to runs/dev_baselines/, tables to results/dev_baselines/.
experiment: dev_baselines
suite: dev
contestants: [do-nothing, rules, solver, reference]
runs: 1  # all four are deterministic, so one run each is the whole story
